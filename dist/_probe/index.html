<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>_probe — 相対パス確認</title>
  <!-- 群B（自前HTMLサイト7件）と同じ形の相対パス参照。base 調整なしで解決されるかを確かめる -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>_probe</h1>
  <p id="verdict">
    この文が<strong>赤く太字</strong>で表示されていれば、
    サブディレクトリ配下でも <code>href="style.css"</code> の相対パスが解決できている
    = 群B 7件は base 調整なしでそのまま配信できる。
  </p>
  <p class="note">
    黒いままなら CSS が 404。その場合は群Bにも base 相当の対応が必要になる。
  </p>
  <p><a href="../">← トップへ戻る</a></p>
</body>
</html>
